name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Signal API health
        env:
          SIGNAL_API_URL: ${{ secrets.SIGNAL_API_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          TARGET_URL="${SIGNAL_API_URL:-${BACKEND_URL:-${RENDER_BACKEND_URL:-}}}"
          if [ -z "$TARGET_URL" ]; then
            echo "Set one GitHub repository secret: SIGNAL_API_URL, BACKEND_URL, or RENDER_BACKEND_URL."
            exit 1
          fi
          if ! echo "$TARGET_URL" | grep -Eq '^https?://'; then
            echo "Backend URL must include https:// or http://"
            exit 1
          fi
          curl -fsS --max-time 45 --retry 2 --retry-delay 10 "${TARGET_URL%/}/health"
