name: Keep backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Signal API awake endpoint
        env:
          SIGNAL_API_URL: ${{ secrets.SIGNAL_API_URL }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          TARGET_URL="${SIGNAL_API_URL:-${BACKEND_URL:-${RENDER_BACKEND_URL:-}}}"
          if [ -z "$TARGET_URL" ]; then
            echo "Set one GitHub repository secret: SIGNAL_API_URL, BACKEND_URL, or RENDER_BACKEND_URL."
            exit 1
          fi
          if ! echo "$TARGET_URL" | grep -Eq '^https?://'; then
            echo "Backend URL must include https:// or http://"
            exit 1
          fi

          BASE_URL="${TARGET_URL%/}"
          WAKE_URL="$BASE_URL/awake"
          echo "Pinging backend wake endpoint: $WAKE_URL"

          success=0
          for attempt in 1 2 3 4 5 6; do
            echo "Wake attempt $attempt at $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            http_code=$(curl -L -sS -o wake-response.json -w "%{http_code}" --connect-timeout 10 --max-time 25 "$WAKE_URL")
            curl_exit=$?
            if [ "$curl_exit" -eq 0 ] && [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
              echo "Wake succeeded with HTTP $http_code"
              cat wake-response.json
              success=1
              break
            fi
            echo "Wake failed: curl_exit=$curl_exit http_code=$http_code"
            if [ -f wake-response.json ]; then
              cat wake-response.json
            fi
            sleep 10
          done

          if [ "$success" -ne 1 ]; then
            echo "Backend did not respond to /awake after multiple attempts."
            exit 1
          fi

          echo "Keep-alive ping completed."
